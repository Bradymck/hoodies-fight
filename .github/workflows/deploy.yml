name: Build, attest, and deploy

# Closes a real gap in the site-verification story (see
# docs/SITE-INTEGRITY-RESEARCH.md): the footer/version.json already prove
# which commit a deploy CLAIMS to be running, but nothing stopped the host
# from lying about it - Vercel builds on its own infra, so a GitHub
# attestation of what GitHub built never actually covered what Vercel
# served. This workflow builds in GitHub's own environment, gets a signed
# provenance attestation for that exact build output, then deploys that
# same prebuilt output to Vercel with --prebuilt so nothing can diverge
# between "what was attested" and "what's live" after this point.
#
# Caveat this does NOT cover: gitignored audio (licensed Splice/Suno
# content, see README's License section) isn't in this checkout at all, so
# it still needs an occasional manual `vercel --prod` deploy from local
# disk to reach the live site. That manual deploy overwrites whatever this
# workflow last shipped - a real, documented tradeoff, not an oversight.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ouRkOrPZM1iixqwAQlZ0kdnk
          VERCEL_PROJECT_ID: prj_9ppd42yUwRsd6du5WhrSAmkwuCdf

      - name: Build (runs scripts/stamp-version.sh via vercel.json)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ".vercel/output/**"

      - name: Deploy the exact attested build
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
